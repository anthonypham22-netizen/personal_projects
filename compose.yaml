services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV to staging or production in .env}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      DATA_DIR: /app/data
      ALLOW_DEMO: ${ALLOW_DEMO:-false}
      COOKIE_SECURE: "true"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      PUBLIC_NETWORK_INDEXING_ENABLED: ${PUBLIC_NETWORK_INDEXING_ENABLED:-false}
    volumes:
      - succera_data:/app/data
    expose:
      - "3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  succera_data:
    name: succera_${APP_ENV:?Set APP_ENV to staging or production}_data
  caddy_data:
  caddy_config:
